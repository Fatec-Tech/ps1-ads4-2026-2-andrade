<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Pacientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container py-5">
  <header class="mb-4">
    <p class="eyebrow mb-1">Sistema de cadastro</p>
    <h1 class="h2">Cadastro de Pacientes</h1>
    <p class="text-secondary">Atividade de CRUD com Fetch API e Express.</p>
  </header>
  <div id="mensagem" aria-live="polite"></div>
  <section class="panel mb-4">
    <h2 class="h5" id="titulo-formulario">Cadastrar paciente</h2>
    <form id="form-paciente" class="row g-3">
      <input type="hidden" id="id">
      <div class="col-md-4"><label for="nome" class="form-label">Nome</label><input id="nome" class="form-control" required maxlength="100"></div>
      <div class="col-md-4"><label for="email" class="form-label">E-mail</label><input id="email" type="email" class="form-control" required maxlength="150"></div>
      <div class="col-md-4"><label for="nascimento" class="form-label">Nascimento</label><input id="nascimento" type="date" class="form-control" required></div>
      <div class="col-12"><button id="btn-salvar" class="btn btn-primary" type="submit">Cadastrar</button> <button id="btn-cancelar" class="btn btn-outline-secondary d-none" type="button">Cancelar edição</button></div>
    </form>
  </section>
  <section class="panel">
    <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Pacientes cadastrados</h2><button id="btn-atualizar-lista" class="btn btn-outline-primary btn-sm" type="button">Atualizar lista</button></div>
    <p id="carregando" class="text-secondary">Carregando pacientes...</p>
    <div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Nome</th><th>E-mail</th><th>Nascimento</th><th>Ações</th></tr></thead><tbody id="tabela-pacientes"></tbody></table></div>
  </section>
  <p class="text-secondary small mt-4">Atividade acadêmica. Não cadastre dados pessoais reais.</p>
</main>
<script src="js/app.js"></script>
</body>
</html>
